name: Temporary React/Tauri dependency cache
on:
  push:
    branches: [ci/radiography-react-deps-20261012]
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch generic React/Tauri packages for isolated offline build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/radiography-react-deps
          cd /tmp/radiography-react-deps
          cat >package.json <<'EOF'
          {
            "name":"radiography-workstation",
            "private":true,
            "version":"0.1.0",
            "type":"module",
            "scripts":{"dev":"vite --host 127.0.0.1","build":"tsc --noEmit && vite build","preview":"vite preview --host 127.0.0.1","tauri":"tauri","dev:desktop":"tauri dev","build:desktop":"tauri build"},
            "dependencies":{"@tauri-apps/api":"^2.0.0","@tauri-apps/plugin-dialog":"^2.0.0","lucide-react":"^0.468.0","react":"^19.0.0","react-dom":"^19.0.0"},
            "devDependencies":{"@types/react":"^19.0.0","@types/react-dom":"^19.0.0","@webgpu/types":"^0.1.60","@vitejs/plugin-react":"^4.3.0","typescript":"^5.8.3","vite":"^6.1.0","@tauri-apps/cli":"^2.0.0"}
          }
          EOF
          npm install --no-audit --no-fund
          tar -czf /tmp/react-deps.tar.gz node_modules package-lock.json
          ls -lh /tmp/react-deps.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: radiography-react-with-lock
          path: /tmp/react-deps.tar.gz
          retention-days: 1
          compression-level: 0
