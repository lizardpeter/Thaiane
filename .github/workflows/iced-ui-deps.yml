name: Rust UI Dependency Cache
on:
  push:
    branches: [ci/iced-ui-prototype-20261012]
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch Iced crates
        run: |
          mkdir -p /tmp/ui/src
          printf '[package]\nname="ui-cache"\nversion="0.1.0"\nedition="2024"\n[dependencies]\niced={version="=0.14.0",features=["wgpu","image","svg","advanced"]}\nrfd="0.16"\n' >/tmp/ui/Cargo.toml
          echo 'fn main() {}' >/tmp/ui/src/main.rs
          cd /tmp/ui
          cargo fetch --target x86_64-unknown-linux-gnu --target x86_64-pc-windows-msvc
          tar -C "$HOME" -czf /tmp/ui-registry.tar.gz .cargo/registry
      - uses: actions/upload-artifact@v4
        with:
          name: iced-crates
          path: /tmp/ui-registry.tar.gz
          retention-days: 1
          compression-level: 0
